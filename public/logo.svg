<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle Background -->
  <circle cx="150" cy="150" r="145" fill="#f5f5f5" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Left Building -->
  <g transform="translate(65, 85)">
    <!-- Main structure -->
    <rect x="0" y="25" width="45" height="85" fill="#1a1a1a" rx="2"/>
    <!-- Roof -->
    <polygon points="0,25 22.5,-8 45,25" fill="#d4af37"/>
    <!-- Window grid 2x3 -->
    <rect x="6" y="35" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="35" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="6" y="55" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="55" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="6" y="75" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="75" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <!-- Door -->
    <rect x="16" y="86" width="13" height="24" fill="#8B4513" rx="1"/>
  </g>
  
  <!-- Right Building (Taller) -->
  <g transform="translate(155, 70)">
    <!-- Main structure -->
    <rect x="0" y="25" width="45" height="100" fill="#1a1a1a" rx="2"/>
    <!-- Roof -->
    <polygon points="0,25 22.5,-10 45,25" fill="#d4af37"/>
    <!-- Window grid 2x4 -->
    <rect x="6" y="35" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="35" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="6" y="55" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="55" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="6" y="75" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="75" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="6" y="95" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <rect x="29" y="95" width="10" height="10" fill="#6eb5ff" rx="1"/>
    <!-- Door -->
    <rect x="16" y="104" width="13" height="21" fill="#8B4513" rx="1"/>
  </g>
  
  <!-- Green Checkmark Bridge -->
  <g transform="translate(120, 115)">
    <path d="M 0 15 L 18 30 L 42 0" stroke="#22c55e" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Company Name -->
  <text x="150" y="225" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" letter-spacing="1">
    NEIGHBORHOOD
  </text>
  <text x="150" y="243" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a" font-family="Arial, sans-serif" letter-spacing="1">
    BUILDERS
  </text>
  <text x="150" y="260" font-size="9" text-anchor="middle" fill="#d4af37" font-family="Arial, sans-serif" letter-spacing="2">
    LONDON
  </text>
</svg>